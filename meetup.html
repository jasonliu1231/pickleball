<!doctype html>
<html lang="zh-Hant">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>聚會資訊｜我的匹克球社團</title>
    <link rel="stylesheet" href="./styles.css">
</head>

<body>
    <div class="wrap">
        <header id="siteHeader" data-open="false">
            <div class="topbar">
                <div class="brand">
                    <div class="logo" aria-hidden="true"></div>
                    <b>我的匹克球社團</b>
                </div>

                <!-- Desktop nav -->
                <nav class="navDesktop" aria-label="主選單">
                    <a href="./index.html">首頁</a>
                    <a href="./knowledge.html">小知識</a>
                    <a href="./meetup.html">聚會資訊</a>
                    <a id="joinNavDesktop" class="btnLink" href="LINE_INVITE_URL" target="_blank" rel="noopener">加入
                        LINE</a>
                </nav>

                <!-- Mobile hamburger -->
                <button class="hamburger" id="hamburger" aria-label="開啟選單" aria-controls="navMobile"
                    aria-expanded="false">
                    <span></span><span></span><span></span>
                </button>
            </div>

            <!-- Mobile dropdown -->
            <nav class="navMobile" id="navMobile" aria-label="行動裝置選單">
                <a href="./index.html">首頁 <span>›</span></a>
                <a href="./knowledge.html">小知識 <span>›</span></a>
                <a href="./meetup.html">聚會資訊 <span>›</span></a>
                <a id="joinNavMobile" href="LINE_INVITE_URL" target="_blank" rel="noopener">加入 LINE <span>↗</span></a>
            </nav>
        </header>

        <main class="card">
            <h1>聚會資訊</h1>
            <p>每個場地都有自己的主教練：把教練放進每個 <code>meetups</code> 物件裡即可。</p>

            <section class="section">
                <h2>聚會場次 / 地點</h2>
                <div id="meetList" class="meetList"></div>
                <p class="note">雨備/取消/臨時更動：以 LINE 公告為準。</p>
            </section>
        </main>
    </div>

    <script>
        // =========================
        // Header hamburger logic
        // =========================
        const headerEl = document.getElementById("siteHeader");
        const hamburgerEl = document.getElementById("hamburger");
        const navMobileEl = document.getElementById("navMobile");

        function setMenuOpen(open) {
            headerEl.dataset.open = open ? "true" : "false";
            hamburgerEl.setAttribute("aria-expanded", open ? "true" : "false");
        }

        hamburgerEl.addEventListener("click", () => {
            const isOpen = headerEl.dataset.open === "true";
            setMenuOpen(!isOpen);
        });

        // 點擊選單連結後關閉
        navMobileEl.addEventListener("click", (e) => {
            const a = e.target.closest("a");
            if (a) setMenuOpen(false);
        });

        // 點擊外部關閉
        document.addEventListener("click", (e) => {
            const withinHeader = e.target.closest("#siteHeader");
            if (!withinHeader) setMenuOpen(false);
        });

        // ESC 關閉
        document.addEventListener("keydown", (e) => {
            if (e.key === "Escape") setMenuOpen(false);
        });

        // =========================
        // Links
        // =========================
        const LINE_URL = "LINE_INVITE_URL";


        // =========================
        // Meetups (each has coach)
        // =========================
        const meetups = [
            {
                name: "XX 運動中心",
                city: "台北",
                address: "台北市XX區XX路XX號（範例）",
                time: "每週六 15:00–17:00（範例）",
                level: "新手～中階",
                fee: "場地 AA / 依場館規定",
                gear: "運動鞋、水、毛巾（球拍可借/自備）",
                notes: [
                    "第一次來：建議提早 10 分鐘到場。",
                    "會安排簡單暖身與基本規則說明。",
                ],
                coach: {
                    name: "教練 A",
                    title: "主教練",
                    intro: "主要帶 0～初階，會從握拍、站位與雙落地制開始教。",
                    avatar: "https://i.postimg.cc/BQpJs6bx/c1.png",
                    tags: [{ k: "擅長", v: "新手入門" }, { k: "風格", v: "穩定控球" }],
                },
            },
            {
                name: "YY 公園球場",
                city: "新北",
                address: "新北市YY區YY路（範例）",
                time: "平日晚上 20:00–22:00（範例）",
                level: "0 基礎可（會帶入門）",
                fee: "免費/或依場地規定",
                gear: "防滑鞋底佳、可帶小毛巾",
                notes: ["戶外場：如遇下雨可能取消。"],
                coach: {
                    name: "教練 B",
                    title: "主教練",
                    intro: "偏向團體輪轉與對打節奏，會協助新手快速進入回合。",
                    avatar: "https://i.postimg.cc/dt6Jv13G/c2.png",
                    tags: [{ k: "擅長", v: "輪轉/對打" }, { k: "重點", v: "站位" }],
                },
            },
        ];

        const meetListEl = document.getElementById("meetList");
        meetListEl.innerHTML = meetups.map(m => renderMeetup(m)).join("");

        function renderMeetup(m) {
            const bullets = (m.notes || []).map(x => `<li>${escapeHtml(x)}</li>`).join("");
            const coach = m.coach ? renderCoachMini(m.coach) : "";

            return `
        <article class="meetItem">
          <div class="meetHead">
            <div>
              <div class="title">${escapeHtml(m.name)}</div>
              <div class="sub">${escapeHtml(m.city)} · ${escapeHtml(m.address)}</div>
            </div>
            <a class="btn" href="${LINE_URL}" target="_blank" rel="noopener">到 LINE 報名</a>
          </div>

          <div class="rows">
            <div class="rowBox"><b>時間</b><span style="color:var(--muted)">${escapeHtml(m.time)}</span></div>
            <div class="rowBox"><b>程度</b><span style="color:var(--muted)">${escapeHtml(m.level)}</span></div>
            <div class="rowBox"><b>費用</b><span style="color:var(--muted)">${escapeHtml(m.fee)}</span></div>
            <div class="rowBox"><b>準備</b><span style="color:var(--muted)">${escapeHtml(m.gear)}</span></div>
          </div>

          ${coach}
          ${bullets ? `<ul class="bullets">${bullets}</ul>` : ""}
        </article>
      `;
        }

        function renderCoachMini(c) {
            const tags = (c.tags || [])
                .map(t => `<span class="chip"><strong>${escapeHtml(t.k)}</strong>${escapeHtml(t.v)}</span>`)
                .join("");

            return `
        <div class="coachMini">
          <div class="avatarMini">
            <img src="${escapeAttr(c.avatar || "")}" alt="${escapeAttr(c.name || "主教練")}">
          </div>
          <div>
            <b>${escapeHtml(c.title ? `${c.title}：${c.name}` : c.name)}</b>
            ${c.intro ? `<div class="muted">${escapeHtml(c.intro)}</div>` : ""}
            ${tags ? `<div class="metaRow" style="margin-top:8px;">${tags}</div>` : ""}
          </div>
        </div>
      `;
        }

        function escapeHtml(s) {
            return String(s ?? "")
                .replaceAll("&", "&amp;")
                .replaceAll("<", "&lt;")
                .replaceAll(">", "&gt;")
                .replaceAll('"', "&quot;")
                .replaceAll("'", "&#039;");
        }
        function escapeAttr(s) { return escapeHtml(s); }
    </script>
</body>

</html>
